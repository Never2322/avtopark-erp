# Кусок для вашего общего nginx.conf (внутрь блока http { ... }, рядом с другими проектами).
# Это не отдельный файл конфигурации: его содержимое копируется в nginx.conf. Подробно: docs/Выкладка-на-сервер.md
#
# Домен ниже придуман для примера. Если у вас другой, замените его в этом куске в 3 местах
# (server_name и два пути к сертификату) и в .env (PUBLIC_URL).
#
# ВАЖНО: сначала вставьте ШАГ 1, выпустите сертификат, и только потом замените ШАГ 1 на ШАГ 2.
# Если вставить ШАГ 2 до появления сертификата, Nginx не перечитает настройки и остановит ВСЕ ваши сайты.


# ───────── ШАГ 1. Временный блок: нужен только чтобы выпустить сертификат ─────────
    # Проект — avtopark-erp (временный блок до выпуска сертификата)
    server {
        listen 80;
        server_name avtopark-erp.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            default_type text/plain;
            return 200 'avtopark-erp: ждём сертификат';
        }
    }


# ───────── ШАГ 2. Рабочий блок: вставьте вместо ШАГА 1, когда сертификат выпущен ─────────
    # Проект — avtopark-erp (учёт автопарка: сайт и сервер приложения за контейнером avtopark-web)
    server {
        listen 80;
        listen 443 ssl;
        server_name avtopark-erp.duckdns.org;

        ssl_certificate /etc/nginx/certs/live/avtopark-erp.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/avtopark-erp.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # сканы и фото: до 10 файлов по 10 МБ за раз (в общем http-блоке стоит всего 10m)
        client_max_body_size 60m;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # по http вход не заработает (кука сессии только для https): уводим на https
            if ($scheme = http) {
                return 301 https://$host$request_uri;
            }
            set $upstream_target http://avtopark-web:80;
            proxy_pass $upstream_target;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Именно «$remote_addr», а не «$proxy_add_x_forwarded_for»: программа берёт из этого заголовка адрес человека
            # для защиты входа (5 неверных паролей, и вход закрывается) и для журнала. Так его нельзя подделать.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # выгрузки отчётов и копии базы бывают долгими
            proxy_read_timeout 300s;
        }
    }
