# Внутренний nginx контейнера avtopark-web (для запуска за общим Nginx: docker-compose.server.yml).
# Это копия frontend/nginx.conf с тремя отличиями:
#   1) сервер приложения вызывается по уникальному имени avtopark-backend, а не по «backend»;
#   2) в сервер приложения передаётся, по какому протоколу пользователь пришёл на самом деле (его знает общий Nginx);
#   3) комментарии. Всё остальное одинаково.
# Если меняете frontend/nginx.conf (заголовки, кэш, размер файлов), поменяйте и этот файл.

# Протокол, с которым пользователь пришёл к общему Nginx (https). Если заголовка нет, берём свой.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 60m;      # сканы: до 10 файлов по 10 МБ за раз

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://avtopark-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 300s;
    }

    # служебный скрипт и описание приложения всегда свежие: иначе телефон не узнает об обновлении
    location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /icons/ { expires 7d; try_files $uri =404; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
